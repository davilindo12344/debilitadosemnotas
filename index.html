<style>
:root{--paper:#f1f4fb;--grid:rgba(44,69,232,.07);--card:#fff;--ink:#141b3a;--mut:#5a6283;--line:#d9dff0;--soft:#e7ebf7;--pen:#2c45e8;--onpen:#fff;--red:#e0383e;--ok:#0c8559;--bad:#cf2f39;--warn:#a85f00;--hl:#ffe14d;--display:"Bricolage Grotesque",system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1228;--grid:rgba(138,160,255,.07);--card:#171c3a;--ink:#eef0ff;--mut:#9aa3cc;--line:#2a3160;--soft:#1f2548;--pen:#8aa0ff;--onpen:#0e1228;--red:#ff6b70;--ok:#4fd8a1;--bad:#ff7b80;--warn:#ffc15a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1228;--grid:rgba(138,160,255,.07);--card:#171c3a;--ink:#eef0ff;--mut:#9aa3cc;--line:#2a3160;--soft:#1f2548;--pen:#8aa0ff;--onpen:#0e1228;--red:#ff6b70;--ok:#4fd8a1;--bad:#ff7b80;--warn:#ffc15a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 56px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.025em;margin:6px 0 22px}
p.sub{color:var(--mut);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-family:var(--display);font-size:1.1rem;font-weight:700;letter-spacing:-.01em;margin:0 0 14px}
#subTitle{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:28px 0 12px}
label{display:block;font-size:.82rem;font-weight:500;color:var(--mut);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus{border-color:var(--pen)}
input:focus-visible,button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:.95rem;background:var(--pen);color:var(--onpen);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;transition:transform .08s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border-radius:9px}
.tabs button.ghost{background:transparent;border:0;color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.who{font-weight:700}
#sync{color:var(--mut);margin-left:6px}
.bar button{padding:8px 14px;font-size:.88rem}
label.sw{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:500;color:var(--ink);cursor:pointer;margin:14px 0 8px}
.sw input{width:20px;height:20px;accent-color:var(--pen)}
small{color:var(--mut);font-size:.82rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.msg{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:10px}
.msg.ok{color:var(--ok)}
.hide{display:none}
hr{border:0;border-top:1.5px dashed var(--line);margin:16px 0}
.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.subs{grid-template-columns:repeat(3,1fr)}}
.sb{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:12px;font-weight:700;line-height:1.25}
.sb small{font-weight:500;color:var(--mut);font-size:.78rem}
.sb.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sb.sel small{color:inherit;opacity:.8}
#tris .card{position:relative;padding-left:26px}
#tris .card::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--red);opacity:.4}
#tris h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#tris h2 small{font-family:"Figtree",system-ui,sans-serif;font-weight:700;color:var(--ink);font-size:.9rem}
#tris .row{grid-template-columns:repeat(4,1fr);gap:8px}
#tris label{text-align:center}
.g{text-align:center;font-family:var(--display);font-weight:700;font-size:1.25rem;padding:12px 4px}
.g[data-a="3"]{border-style:dashed}
.res{padding:20px}
.res b{font-weight:800}
.prog{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;background:var(--pen);border-radius:99px;transition:width .3s}
.need{display:flex;align-items:center;gap:16px;margin:14px 0 10px;font-weight:600}
.circ{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;padding:10px 22px;border:3px solid var(--red);border-radius:52% 48% 55% 45%/58% 50% 50% 42%;transform:rotate(-3deg);color:var(--ink);flex:none}
.big{display:block;width:fit-content;font-family:var(--display);font-weight:800;font-size:1.5rem;padding:6px 16px;border:3px double currentColor;border-radius:10px;transform:rotate(-2deg);margin:12px 0 10px}
.chip{display:inline-block;background:var(--hl);color:#141b3a;border-radius:8px;padding:4px 10px;margin:4px 6px 4px 0;font-size:.88rem;font-weight:600}
.chip.done{background:transparent;border:1.5px solid var(--line);color:var(--mut);font-weight:500}
#app>small{display:block;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Jeito Damas de Ser</h1>

<section id="login" class="card">
  <div class="tabs">
    <button id="tEntrar" type="button">Entrar</button>
    <button id="tCriar" type="button" class="ghost">Criar conta</button>
  </div>
  <div id="fNome" class="hide" style="margin-bottom:10px">
    <label for="nome">Nome</label>
    <input type="text" id="nome" autocomplete="name">
  </div>
  <label for="email">E-mail</label>
  <input type="email" id="email" autocomplete="email">
  <label for="senha" style="margin-top:10px">Senha</label>
  <input type="password" id="senha" autocomplete="current-password">
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button id="go" type="button">Entrar</button>
    <button id="forgot" type="button" class="ghost">Esqueci a senha</button>
  </div>
  <div class="msg" id="lmsg"></div>
  <small>Suas notas ficam salvas na sua conta e aparecem em qualquer aparelho.</small>
</section>

<section id="reset" class="card hide">
  <h2>Criar nova senha</h2>
  <label for="rNova">Nova senha</label>
  <input type="password" id="rNova" autocomplete="new-password">
  <div style="margin-top:12px"><button id="rGo" type="button">Salvar nova senha</button></div>
  <div class="msg" id="rmsg"></div>
</section>

<section id="app" class="hide">
  <div class="bar">
    <span><span class="who" id="who"></span> <small id="sync"></small></span>
    <button class="ghost" id="logout" type="button">Sair</button>
  </div>

  <div class="card">
    <h2>Matérias</h2>
    <div class="subs" id="subs"></div>
  </div>

  <div class="card">
    <h2>SECIC no 3º trimestre</h2>
    <label class="sw" style="margin-top:12px"><input type="checkbox" id="sOn"> Vou ter SECIC no 3º trimestre (+3 pontos)</label>
    <small>O SECIC vale exatamente 3 pontos: 1 em cada AV do 3º tri, ou tudo na AV que faltar nota, sem passar de 10 por AV.</small>
  </div>

  <h2 id="subTitle"></h2>
  <div id="tris"></div>
  <div class="card res" id="out"></div>
</section>
</main>

var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var mode="entrar", user=null, uid=null, timer=null, recovering=/type=recovery/.test(location.hash);
var SUBJ=["Inglês","Matemática","Filosofia","Gramática","Biologia","Geografia","Literatura","Química","Física","Redação","Sociologia","Educação Física","História"];
var $=function(i){return document.getElementById(i)};
function newSub(){return{g:[[null,null,null],[null,null,null],[null,null,null]],r:[null,null,null]}}
function def(){var o={need:21,s:{on:false,max:3},sel:SUBJ[0],sub:{}};SUBJ.forEach(function(n){o.sub[n]=newSub()});return o}
function norm(d){
  var o=def();
  if(!d)return o;
  
  if(d.s&&d.s.max!=null)o.s={on:!!d.s.on,max:d.s.max};
  if(d.sub){SUBJ.forEach(function(n){if(d.sub[n]){o.sub[n]=d.sub[n];if(!o.sub[n].r)o.sub[n].r=[null,null,null]}});if(d.sel&&o.sub[d.sel])o.sel=d.sel}
  else if(d.g){o.sub[SUBJ[0]].g=d.g}
  return o;
}
var st=def();

function msg(t,ok){var e=$("lmsg");e.textContent=t;e.className="msg"+(ok?" ok":"")}
function tr(m){
  m=m||"";
  if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if(/already registered/i.test(m))return"Esse e-mail já tem conta. Tente entrar.";
  if(/at least/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/rate limit|too many/i.test(m))return"Muitas tentativas. Aguarde um pouco e tente de novo.";
  if(/valid email|invalid.*email/i.test(m))return"E-mail inválido.";
  return m;
}
function persist(){
  if(!uid||!sb)return;
  clearTimeout(timer);
  $("sync").textContent="salvando...";
  timer=setTimeout(async function(){
    var r=await sb.from("notas").upsert({user_id:uid,dados:st,updated_at:new Date().toISOString()});
    $("sync").textContent=r.error?"⚠️ erro ao salvar":"☁️ salvo";
  },500);
}
function setMode(m){
  mode=m;
  $("go").textContent=m==="entrar"?"Entrar":"Criar conta";
  $("tEntrar").className=m==="entrar"?"":"ghost";
  $("tCriar").className=m==="criar"?"":"ghost";
  $("fNome").classList.toggle("hide",m!=="criar");
  $("forgot").classList.toggle("hide",m!=="entrar");
  $("senha").autocomplete=m==="criar"?"new-password":"current-password";
  msg("");
}
$("tEntrar").onclick=function(){setMode("entrar")};
$("tCriar").onclick=function(){setMode("criar")};
$("go").onclick=async function(){
  if(!sb){msg("Não foi possível carregar o Supabase. Verifique a internet.");return}
  var em=$("email").value.trim(), p=$("senha").value, n=$("nome").value.trim();
  if(!em||!p){msg("Preencha e-mail e senha.");return}
  $("go").disabled=true;
  try{
    if(mode==="criar"){
      if(!n){msg("Digite seu nome.");return}
      if(p.length<6){msg("A senha precisa ter pelo menos 6 caracteres.");return}
      var r=await sb.auth.signUp({email:em,password:p,options:{data:{name:n},emailRedirectTo:location.origin+location.pathname}});
      if(r.error){msg(tr(r.error.message));return}
      if(!r.data.session){setMode("entrar");msg("Conta criada! Confirme pelo link que enviamos para o seu e-mail e depois entre.",true)}
    }else{
      var r2=await sb.auth.signInWithPassword({email:em,password:p});
      if(r2.error){msg(tr(r2.error.message));return}
    }
  }finally{$("go").disabled=false}
};
$("forgot").onclick=async function(){
  if(!sb)return;
  var em=$("email").value.trim();
  if(!em){msg("Digite seu e-mail acima e clique de novo.");return}
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(r.error)msg(tr(r.error.message));else msg("Enviamos um link para o seu e-mail.",true);
};
$("rGo").onclick=async function(){
  var np=$("rNova").value;
  if(np.length<6){$("rmsg").textContent="A senha precisa ter pelo menos 6 caracteres.";return}
  var r=await sb.auth.updateUser({password:np});
  if(r.error){$("rmsg").textContent=tr(r.error.message);return}
  recovering=false;$("reset").classList.add("hide");$("rNova").value="";
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  startSession(r.data.user);
};
$("logout").onclick=async function(){if(sb)await sb.auth.signOut()};

async function startSession(u){
  if(uid===u.id)return;
  uid=u.id;
  user=(u.user_metadata&&u.user_metadata.name)||u.email;
  var r=await sb.from("notas").select("dados").eq("user_id",uid).maybeSingle();
  if(r.error){
    msg("Erro ao carregar suas notas: "+r.error.message);
    await sb.auth.signOut();
    return;
  }
  st=norm(r.data&&r.data.dados);
  enter();
}
function enter(){
  $("login").classList.add("hide");$("reset").classList.add("hide");$("app").classList.remove("hide");
  $("who").textContent="👤 "+user;$("sync").textContent="☁️ salvo";
  $("sOn").checked=st.s.on;
  build();render();
}
function showLogin(){
  uid=null;user=null;st=def();
  $("app").classList.add("hide");$("reset").classList.add("hide");$("login").classList.remove("hide");
  $("senha").value="";
}

function num(v){if(v===""||v==null)return null;var x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x}
function f(x){return (Math.round(x*100)/100).toString().replace(".",",")}
/* média do trimestre: 6,96 → 7,0 | 6,95 → 6,9 */
function R(x){return Math.floor(x*10+0.4+1e-9)/10}
/* nota necessária: sempre arredonda pra cima (1 casa) */
function c1(x){return f(Math.ceil(x*10-1e-9)/10)}
function inp(t,a,v){return '<div><label>'+(a<3?'AV'+(a+1):'AVR')+'</label><input type="number" step="0.1" min="0" max="10" class="g" data-t="'+t+'" data-a="'+a+'" value="'+(v==null?"":v)+'"></div>'}

function build(){
  var d=st.sub[st.sel], h="";
  $("subTitle").textContent=st.sel;
  for(var t=0;t<3;t++){
    h+='<div class="card"><h2>'+(t+1)+'º Trimestre <small id="sub'+t+'"></small></h2><div class="row">';
    IDX(st.sel).forEach(function(a){h+=inp(t,a,d.g[t][a])});
    h+=inp(t,3,d.r[t])+'</div></div>';
  }
  $("tris").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".g"),function(el){
    el.oninput=function(){
      var v=num(el.value); if(v!=null)v=Math.min(10,Math.max(0,v));
      var t=+el.dataset.t,a=+el.dataset.a,dd=st.sub[st.sel];
      if(a<3)dd.g[t][a]=v;else dd.r[t]=v;
      persist();render();
    };
  });
}


$("sOn").onchange=function(){st.s.on=this.checked;persist();render()};

/* análise de uma matéria */
function IDX(n){return n==="Educação Física"?[0,2]:[0,1,2]}
function A(d,b,nm){
  var ix=IDX(nm),N=ix.length;
  var T=[0,0,0],k3=0,blanks=0,names=[],rep=[false,false,false];
  for(var t=0;t<3;t++){
    var s=0;
    for(var j=0;j<N;j++){
      var a=ix[j],v=d.g[t][a];
      if(v!=null)s+=v; else if(t===2){blanks++;names.push("AV"+(a+1))}
    }
    var avg=R(t<2?s/N:Math.min(10*N,s+b)/N);
    if(t===2)k3=s;
    var r=d.r[t];
    if(r!=null&&r>avg){T[t]=r;rep[t]=true}else T[t]=avg;
  }
  var total=T[0]+T[1]+T[2], r3=d.r[2];
  var req=st.need-T[0]-T[1], o={T:T,rep:rep,total:total,req:req,blanks:blanks,names:names,N:N,ix:ix,state:"",avr:null};
  if(req>0&&req<=10&&r3==null)o.avr=req;
  if(req<=1e-9||(r3!=null&&r3+1e-9>=req)){o.state="passed";return o}
  if(req>10+1e-9){o.state="impossible";o.short=(req-10);return o}
  if(blanks===0){
    if(R(Math.min(10*N,k3+b)/N)+1e-9>=req)o.state="passed";
    else o.state=r3==null?"avr":"impossible";
    return o;
  }
  var nb=N*(req-0.04)-b-k3;
  if(nb<=1e-9){o.state="passed";return o}
  o.nb=nb;o.per=nb/blanks;
  if(o.per<=10+1e-9)o.state="need";
  else{o.state=r3==null?"avr":"impossible";o.faltam=(nb-10*blanks)/N}
  return o;
}
function bonus(){return st.s.on?3:0}
function short(o){
  if(o.state==="passed")return["✅","passou"];
  if(o.state==="need")return["⏳","precisa "+c1(o.per)+(o.blanks>1?" por AV":" na "+o.names[0])];
  if(o.state==="avr")return["🔁","AVR: "+c1(o.avr)];
  return["❌","sem chance"];
}

function render(){
  var h="";
  SUBJ.forEach(function(n){
    var o=A(st.sub[n],bonus(),n), s=short(o);
    h+='<button type="button" class="sb'+(n===st.sel?' sel':'')+'" data-n="'+n+'">'+s[0]+' '+n+'<small>'+f(o.total)+' pts · '+s[1]+'</small></button>';
  });
  $("subs").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".sb"),function(b){
    b.onclick=function(){st.sel=b.dataset.n;persist();build();render()};
  });

  var d=st.sub[st.sel], b=bonus(), o=A(d,b,st.sel);
  for(var t=0;t<3;t++){
    $("sub"+t).textContent="média "+f(o.T[t])+(o.rep[t]?" (AVR)":(t===2&&b&&!o.rep[t]?" (com SECIC)":""));
  }
  var pct=Math.min(100,Math.max(0,st.need?o.total/st.need*100:0));
  var out='<h2>Resultado em '+st.sel+'</h2><div>Total atual: <b>'+f(o.total)+'</b> de <b>'+f(st.need)+'</b> <small>(soma das 3 médias, máx. 30)</small></div>';
  out+='<div class="prog"><div style="width:'+pct+'%"></div></div>';

  function scen(title,b){
    var o=A(d,b,st.sel), r=title?'<hr><b>'+title+'</b>':'';
    if(o.state==="passed")return r+'<div class="big ok">Já passou!</div><small>'+(d.r[2]!=null&&o.rep[2]?'Com a AVR você fecha.':'Com o que você já tem (e/ou zerando o que falta) você fecha '+f(st.need)+'.')+'</small>';
    if(o.state==="impossible"){
      return r+'<div class="big bad">Sem chance</div><small>'+(o.faltam!=null?'Mesmo tirando 10 em tudo, faltariam '+f(o.faltam)+' pt(s) no total.':'Precisaria de média '+f(o.req)+' no 3º trimestre (máx. 10).')+'</small>';
    }
    if(o.state==="avr")return r+'<div class="big warn">Só pela AVR</div><small>Pelas AVs não dá. Na AVR do 3º trimestre você precisa de <b>'+c1(o.avr)+'</b>.</small>';
    var c=o.per>8.5?"warn":"ok";
    var x='<div class="need '+c+'"><span class="circ">'+c1(o.per)+'</span><span>'+(o.blanks>1?'em média, em cada AV':'na '+o.names[0])+'</span></div><div>';
    o.ix.forEach(function(q){var gv=d.g[2][q];x+='<span class="chip'+(gv!=null?' done':'')+'">AV'+(q+1)+': '+(gv!=null?f(gv)+' ✓ (já tirou)':'precisa de '+c1(o.per))+'</span>'});
    x+='</div>';
    if(b)x+='<small>Já contando o SECIC completando até 10 em cada AV.</small>';
    else if(o.blanks>1)x+='<small>Soma necessária nas AVs que faltam: '+c1(o.nb)+' de '+(10*o.blanks)+'. Pode dividir como quiser.</small>';
    if(o.avr!=null)x+='<br><small>Plano B: AVR do 3º tri com <b>'+c1(o.avr)+'</b>.</small>';
    return r+x;
  }
  if(b>0){out+=scen("Com SECIC ("+f(b)+" pts)",b)+scen("Sem SECIC",0)}
  else out+=scen("",0);
  $("out").innerHTML=out;
}
setMode("entrar");
if(!sb){msg("Não foi possível carregar o Supabase. Verifique a internet.")}
else sb.auth.onAuthStateChange(function(ev,session){
  setTimeout(function(){
    if(ev==="PASSWORD_RECOVERY"||recovering){
      $("login").classList.add("hide");$("reset").classList.remove("hide");return;
    }
    if(session&&session.user)startSession(session.user);
    else if(ev==="SIGNED_OUT"||ev==="INITIAL_SESSION")showLogin();
  },0);
});
})();
</script>
</body>
</html>
